<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 5</title>
</head>
<style>
    .cor{
        background-color: rgb(13, 43, 88);
        color:rgb(189, 179, 179);
        font-weight: bold;
    }
    h1{
        margin-left: 50px;
        text-decoration:underline;
        text-underline-offset: 9px;
    }
    .linhamento{
        margin-left: 52px;
        margin-top: 60px;

    }
    .login{
        background-color: red;
        width: 275px;
        height: 35px;
    }
    form{
        padding-right: 840px;
    }
    .linha{
        border: none;
        border-bottom: 1px solid rgb(189, 179, 179);
        padding-bottom: 5px;
        color: rgb(189, 179, 179);
    }
    input{
        width: 270px;
    }
    h6{
        padding-left: 100px;
    }
</style>
<body>
    <main>
        <form>
            <fieldset class="cor">
                <br>
                <div >
                <h1> Login</h1>
                </div>
                <div class="linhamento">
                <label for="name">Usuário</label>
                <br>
                <input class="linha" style="background-color: rgb(13, 43, 88);" type="name" id="name">
                <br>
                <label for="senha">Senha</label>
                <br>
                <input class="linha" style="background-color: rgb(13, 43, 88);" type="password" id="senha">
                <br>
                <br>
                <input style="padding-left:0; color:rgb(189, 179, 179)" class="login" type="button" id="login" value="login"> 
                <br>
                <h6><a href="" style="text-decoration: none; color:rgb(189, 179, 179)">Esqueceu a senha?</a></h6>
                </div>
            </fieldset>
        </form>
    </main>
    
</body>
</html>
