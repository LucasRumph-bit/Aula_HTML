<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2</title>
</head>
<body>
    <h3>Cadastro de novos materias de aula</h3>

    <form action="">
        <fieldset>
            <legend>Lista de materias já cadastrados</legend>
            <ol>
                <li>Lápis</li>
                <li>Caneta</li>
                <li>Papel</li>
                <li>Tesoura</li>
            </ol>
        </fieldset>
        <fieldset>
            <legend>Cadastrar novo material</legend>
            <label for="nome "></label>
            <input type="text" id="nome" placeholder="Nome">
            
            <br>
            <label for="preço"></label>
            <input type="text" id="preço" placeholder="Preço">
            <br>
            <label for="quantidade">Quantidade:</label>
            <input type="number" min="0">
            <br>
            Devolução <input type="radio" name="sim"> Sim
            <input type="radio" name="sim"> Não
            <br>
            <input type="reset" value="Limpar">
            <input type="submit" value="Enviar">
        </fieldset>
        <fieldset>
            <legend>Dados do último material cadastrado</legend>
            <table border="1">
                <tbody>
                    <tr>
                        <th>Nome</th>
                        <td>Lápis</td>
                    </tr>
                    <tr>
                        <th>Preço</th>
                        <td>R$12,30</td>
                    </tr>
                    <tr>
                        <th>Quantidade</th>
                        <td>200</td>
                    </tr>
                    <tr>
                        <th>Devolução</th>
                        <td>Sim</td>
                    </tr>
                </tbody>
            </table>
        </fieldset>
    </form>


    
</body>
</html>
