<!DOCTYPE html>
<html lang="pt-br">
<head>

<body>
    <h3>Cadastro de novos materias de aula</h3>

    <form action="">
        <fieldset>
            <legend>Lista de materias já cadastrados</legend>
            <ol>
                <li>Lápis</li>
                <li>Caneta</li>
                <li>Papel</li>
                <li>Tesoura</li>

        </fieldset>
        <fieldset>
            <legend>Cadastrar novo material</legend>
            <label for="nome "></label>
            <input type="text" id="nome" placeholder="Nome">
            
            <br>
            <label for="preço"></label>
            <input type="text" id="preço" placeholder="Preço">
        </fieldset>
    </form>


    
</body>
